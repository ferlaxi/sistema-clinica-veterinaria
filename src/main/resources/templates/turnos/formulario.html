<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Agendar Turno')}"></head>
<body>
    
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div class="container mt-4 mb-5">
        <h2 class="page-title text-center mx-auto d-block fw-bold text-dark">Solicitar Consulta Médica</h2>

        <div class="row"><div class="col-lg-8 mx-auto"><div class="card p-5 border-0 shadow-sm mt-4 bg-light">
            <form th:action="@{/turnos/guardar}" th:object="${turno}" method="post">
                
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted"><i class="bi bi-clock-history me-2"></i>Fecha y Hora Deseada</label>
                    <input type="datetime-local" class="form-control bg-white border-0 shadow-sm" th:field="*{fechaHora}" th:classappend="${#fields.hasErrors('fechaHora')} ? 'is-invalid' : ''">
                    <div class="form-text mt-2"><i class="bi bi-info-circle me-1"></i>Si dejas la fecha vacía, se pautará para hoy de manera urgente.</div>
                    <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('fechaHora')}" th:errors="*{fechaHora}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted"><i class="bi bi-bug-fill me-2"></i>Paciente <span class="text-danger">*</span></label>
                    <select class="form-select bg-white border-0 shadow-sm" th:field="*{mascotaId}" th:classappend="${#fields.hasErrors('mascotaId')} ? 'is-invalid' : ''">
                        <option value="">Seleccione la mascota a atender</option>
                        <option th:each="m : ${mascotas}" th:value="${m.id}" th:text="${m.nombre + ' (' + m.especie + ') - Dueño: ' + m.nombreDuenio}"></option>
                    </select>
                    <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('mascotaId')}" th:errors="*{mascotaId}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted"><i class="bi bi-chat-square-text me-2"></i>Motivo de Consulta <span class="text-danger">*</span></label>
                    <input type="text" class="form-control bg-white border-0 shadow-sm" th:field="*{motivo}" placeholder="Ej: Vacunación, descompensación..." th:classappend="${#fields.hasErrors('motivo')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></div>
                </div>

                <div class="mb-4" sec:authorize="hasAnyRole('ADMIN', 'VETERINARIO')">
                    <label class="form-label fw-bold text-muted"><i class="bi bi-person-badge-fill me-2"></i>Veterinario Asignado</label>
                    <select class="form-select bg-white border-0 shadow-sm" th:field="*{veterinarioId}">
                        <option value="">Dejar sin asignar / Abierto a cualquier profesional</option>
                        <option th:each="v : ${veterinarios}" th:value="${v.id}" th:text="${'Dr/a. ' + v.username}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-between mt-5 border-top pt-4">
                    <a th:href="@{/turnos}" class="btn btn-light rounded-pill px-4 fw-bold shadow-sm border"><i class="bi bi-arrow-left me-1"></i>Regresar</a>
                    <button type="submit" class="btn btn-primary text-white rounded-pill px-4 fw-bold shadow-sm"><i class="bi bi-calendar-check me-2"></i>Agendar Turno</button>
                </div>
            </form>
        </div></div></div>
        </div>
    </div>
    </body>
</html>
