<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${duenio.id == null ? 'Nuevo Dueño' : 'Editar Dueño'})}"></head>
<body>
    
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div class="container mt-5 mb-5">
        <h2 class="fw-bold text-dark text-center" th:text="${duenio.id == null ? 'Registrar Nuevo Dueño' : 'Modificar Dueño'}">Formulario</h2>
        <p class="text-muted text-center mb-4">Complete los datos del cliente para su expediente.</p>

        <div class="row"><div class="col-lg-8 mx-auto"><div class="card p-5 border-0 shadow-sm">

            <div th:if="${errorDni != null}" class="alert alert-danger fw-bold rounded-4 shadow-sm mb-4">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorDni}"></span>
            </div>
            
            <form th:action="@{/duenios/guardar}" th:object="${duenio}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{usuarioId}" />

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold text-muted">Nombre</label>
                        <input type="text" class="form-control form-control-lg bg-white shadow-sm border-0" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold text-muted">Apellido</label>
                        <input type="text" class="form-control form-control-lg bg-white shadow-sm border-0" th:field="*{apellido}" th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted">Documento Nacional de Identidad (DNI) <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-lg bg-white shadow-sm border-0" th:field="*{dni}" placeholder="Sin puntos ni espacios" th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold text-muted">Teléfono de Contacto <span class="text-danger">*</span></label>
                        <div class="input-group shadow-sm border-0 rounded-3">
                            <span class="input-group-text bg-white border-0 text-muted"><i class="bi bi-telephone"></i></span>
                            <input type="text" class="form-control form-control-lg bg-white border-0" th:field="*{telefono}" th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold text-muted">Dirección <small class="fw-normal">(Opcional)</small></label>
                        <input type="text" class="form-control form-control-lg bg-white shadow-sm border-0" th:field="*{direccion}">
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-5 gap-3">
                    <a th:href="@{/duenios}" class="btn btn-light rounded-pill fw-bold text-muted w-50 py-3 shadow-sm border">Cancelar</a>
                    <button type="submit" class="btn btn-primary text-white rounded-pill fw-bold w-50 py-3 shadow-sm"><i class="bi bi-save me-2"></i><span th:text="${duenio.id == null ? 'Registrar Dueño' : 'Guardar Cambios'}"></span></button>
                </div>
            </form>
        </div></div></div>
        </div>
    </div>

    </body>
</html>
