version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: veterinaria_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: veterinaria_db
    ports:
      - "3306:3306"
    volumes:
      - veterinaria-mysql-data:/var/lib/mysql

  app:
    build: .
    container_name: veterinaria_app_container
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=veterinaria_db
      - DB_USER=root
      - DB_PASSWORD=root
    depends_on:
      - db

volumes:
  veterinaria-mysql-data:
